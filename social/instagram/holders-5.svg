<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Charter, Georgia, 'Times New Roman', serif"><rect width="1080" height="1350" fill="#f6f3ec"/><rect x="0" y="0" width="1080" height="10" fill="#1b3a6b"/><text x="90" y="112" font-size="27" fill="#6e6a60" font-weight="700" text-anchor="start">PROOF<tspan dx="8">OF</tspan><tspan dx="8">CROWD</tspan></text><text x="990" y="112" font-size="27" fill="#6e6a60" font-weight="400" text-anchor="end">5/5</text><text x="90" y="400" font-size="52" fill="#15171c" font-weight="700" text-anchor="start">Put<tspan dx="16">that</tspan><tspan dx="16">another</tspan><tspan dx="16">way</tspan></text><text x="90" y="519.84" font-size="40" fill="#15171c" font-weight="700" text-anchor="start">$BLUR<tspan dx="12">reports</tspan><tspan dx="12">51,179</tspan><tspan dx="12">holders.</tspan><tspan dx="12">48,277</tspan><tspan dx="12">are</tspan></text><text x="90" y="576.64" font-size="40" fill="#15171c" font-weight="700" text-anchor="start">wallets,<tspan dx="12">and</tspan><tspan dx="12">1,240</tspan><tspan dx="12">of</tspan><tspan dx="12">those</tspan><tspan dx="12">hold</tspan><tspan dx="12">$100</tspan><tspan dx="12">or</tspan></text><text x="90" y="633.4399999999999" font-size="40" fill="#15171c" font-weight="700" text-anchor="start">more.</text><text x="90" y="740.2399999999999" font-size="36" fill="#6e6a60" font-weight="400" text-anchor="start">A holder count treats eleven cents exactly as it</text><text x="90" y="791.3599999999999" font-size="36" fill="#6e6a60" font-weight="400" text-anchor="start">treats eleven thousand dollars.</text><text x="90" y="892.4799999999999" font-size="32" fill="#6e6a60" font-weight="400" text-anchor="start">Dollar thresholds move with price, so a token that has</text><text x="90" y="937.9199999999998" font-size="32" fill="#6e6a60" font-weight="400" text-anchor="start">fallen shows more residue without its holders having</text><text x="90" y="983.3599999999999" font-size="32" fill="#6e6a60" font-weight="400" text-anchor="start">changed.</text><text x="90" y="1238" font-size="27" fill="#6e6a60" font-weight="400" text-anchor="start">proofofcrowd.com</text><circle cx="468.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="504.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="540.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="576.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="612.0" cy="1290" r="7" fill="#1b3a6b"/></svg>