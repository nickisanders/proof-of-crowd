<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Charter, Georgia, 'Times New Roman', serif"><rect width="1080" height="1350" fill="#f6f3ec"/><rect x="0" y="0" width="1080" height="10" fill="#1b3a6b"/><text x="90" y="112" font-size="27" fill="#6e6a60" font-weight="700" text-anchor="start">PROOF<tspan dx="8">OF</tspan><tspan dx="8">CROWD</tspan></text><text x="990" y="112" font-size="27" fill="#6e6a60" font-weight="400" text-anchor="end">2/5</text><text x="90" y="300" font-size="52" fill="#15171c" font-weight="700" text-anchor="start">The<tspan dx="16">first</tspan><tspan dx="16">thing</tspan><tspan dx="16">it</tspan><tspan dx="16">hides</tspan></text><text x="90" y="413.84000000000003" font-size="38" fill="#6e6a60" font-weight="400" text-anchor="start">Not every holder is a person. Contracts,</text><text x="90" y="467.8" font-size="38" fill="#6e6a60" font-weight="400" text-anchor="start">exchange wallets and burn addresses all count</text><text x="90" y="521.76" font-size="38" fill="#6e6a60" font-weight="400" text-anchor="start">as one holder each.</text><text x="90" y="651.72" font-size="92" fill="#6e6a60" font-weight="700" text-anchor="start">15,103</text><text x="90" y="701.72" font-size="32" fill="#6e6a60" font-weight="400" text-anchor="start">addresses hold $AZTEC</text><text x="90" y="801.72" font-size="92" fill="#1b3a6b" font-weight="700" text-anchor="start">6,004</text><text x="90" y="851.72" font-size="32" fill="#6e6a60" font-weight="400" text-anchor="start">of them are wallets</text><text x="90" y="939.72" font-size="40" fill="#15171c" font-weight="700" text-anchor="start">Three<tspan dx="12">in</tspan><tspan dx="12">five</tspan><tspan dx="12">were</tspan><tspan dx="12">never</tspan><tspan dx="12">a</tspan><tspan dx="12">person</tspan><tspan dx="12">to</tspan></text><text x="90" y="996.52" font-size="40" fill="#15171c" font-weight="700" text-anchor="start">begin<tspan dx="12">with.</tspan></text><circle cx="468.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="504.0" cy="1290" r="7" fill="#1b3a6b"/><circle cx="540.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="576.0" cy="1290" r="7" fill="#ded8cd"/><circle cx="612.0" cy="1290" r="7" fill="#ded8cd"/></svg>