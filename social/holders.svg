<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f6f3ec"/><rect x="0" y="0" width="1200" height="8" fill="#1b3a6b"/><text x="64" y="58" font-size="18" fill="#6e6a60" font-weight="700" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">PROOF OF CROWD</text><text x="64" y="108" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">Every project leads with a holder count.</text><text x="64" y="150" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">Almost none say what those holders hold.</text><text x="64" y="188" font-size="19" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">Share of wallets holding $100 or more. Contracts and exchange wallets removed.</text><text x="64" y="241" font-size="21" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">$STRK</text><rect x="200" y="220" width="560" height="32" fill="#ffffff"/><rect x="200" y="220" width="580" height="32" fill="#1b3a6b"/><text x="768" y="241" font-size="20" fill="#ffffff" font-weight="700" text-anchor="end" font-family="Menlo, ui-monospace, monospace">41.5%</text><text x="788" y="241" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">34,395 wallets</text><text x="64" y="279" font-size="21" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">$ENS</text><rect x="200" y="258" width="560" height="32" fill="#ffffff"/><rect x="200" y="258" width="524" height="32" fill="#1b3a6b"/><text x="712" y="279" font-size="20" fill="#ffffff" font-weight="700" text-anchor="end" font-family="Menlo, ui-monospace, monospace">37.4%</text><text x="788" y="279" fon