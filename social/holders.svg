t x="88" y="593" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">A holder count treats eleven cents exactly as it treats eleven thousand dollars.</text><line x1="64" y1="632" x2="1136" y2="632" stroke="#ded8cd" stroke-width="2"/><text x="64" y="660" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, 'Times New Roman', serif">Every balance read from the chain. Nothing sampled.</text><text x="1136" y="660" font-size="18" fill="#1b3a6b" font-weight="700" text-anchor="end" font-family="Charter, Georgia, 'Times New Roman', serif">proofofcrowd.com</text></svg>