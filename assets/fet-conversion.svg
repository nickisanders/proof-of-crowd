<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="56" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">The attention peaks did not bring buyers</text><text x="60" y="90" font-size="21" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">first-time onchain holders per million interactions, 45-day window</text><rect x="120" y="150" width="300" height="250" rx="4" fill="#8d8578"/><text x="270" y="134.0" font-size="36" fill="#8d8578" font-weight="700" text-anchor="middle" font-family="Menlo, ui-monospace, monospace">479</text><text x="270" y="430" font-size="22" fill="#15171c" font-weight="400" text-anchor="middle" font-family="Charter, Georgia, serif">ordinary days</text><text x="270" y="458" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="middle" font-family="Charter, Georgia, serif">192 new holders a day</text><rect x="600" y="305" width="300" height="95" rx="4" fill="#a33228"/><text x="750" y="288.7768043387568" font-size="36" fill="#a33228" font-weight="700" text-anchor="middle" font-family="Menlo, ui-monospace, monospace">183</text><text x="750" y="430" font-size="22" fill="#15171c" font-weight="400" text-anchor="middle" font-family="Charter, Georgia, serif">spike days</text><text x="750" y="458" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="middle" font-family="Charter, Georgia, serif">264 new holders a day</text><rect x="90" y="400" width="1020" height="1.5" fill="#ded8cd"/><text x="60" y="520" font-size="22" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">Spike days carried 3.6x the attention and 1.37x the new holders.</text><text x="60" y="550" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">The extra attention converted at 0.38x the ordinary rate.</text><text x="60" y="590" font-size="17" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Caveat: ~99.9% of $FET volume is on exchanges, where a buyer creates no onchain transfer.</text></svg>