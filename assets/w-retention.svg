<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><rect width="1200" height="880" fill="#ffffff"/><text x="60" y="58" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">26,714 addresses have held $W.</text><text x="60" y="96" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">9,598 still do.</text><text x="60" y="132" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Every address that ever received the token on Ethereum, across the contract's full 901-day history.</text><rect x="60" y="206" width="1080" height="86" fill="#f2efe8"/><rect x="60" y="206" width="1080" height="86" fill="#8d8578"/><text x="84" y="262" font-size="38" fill="#ffffff" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">26,714</text><text x="1116.0" y="261" font-size="22" fill="#ffffff" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">ever received it</text><rect x="60" y="318" width="1080" height="86" fill="#f2efe8"/><rect x="60" y="318" width="388" height="86" fill="#1b3a6b"/><text x="84" y="374" font-size="38" fill="#ffffff" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">9,598</text><text x="424.0302463127948" y="373" font-size="22" fill="#ffffff" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">still hold it</text><rect x="60" y="430" width="1080" height="86" fill="#f2efe8"/><rect x="60" y="430" width="60" height="86" fill="#a33228"/><text x="144.11679269296997" y="486" font-size="38" fill="#a33228" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">1,487</text><text x="310.11679269296997" y="485" font-size="22" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">hold $100 or more</text><line x1="60" y1="560" x2="1140" y2="560" stroke="#ded8cd" stroke-width="2"/><text x="60" y="608" font-size="30" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">35.9% retention. 17,116 addresses have left.</text><text x="60" y="642" font-size="21" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">About 5.6% of every address that ever touched $W holds a position worth something today.</text><rect x="60" y="672" width="1080" height="74" fill="#fbf7ef"/><rect x="60" y="672" width="5" height="74" fill="#8d8578"/><text x="86" y="698" font-size="21" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">35.9% is not a pass or a fail. This figure has no absolute threshold.</text><text x="86" y="726" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">It is informative against a token's own history and against tokens of a similar size.</text><line x1="60" y1="794" x2="1140" y2="794" stroke="#ded8cd" stroke-width="2"/><text x="60" y="830" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Uncommissioned. Published in full.</text><text x="1140" y="830" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">proofofcrowd.com  ·  measured 2026-10-17</text></svg>