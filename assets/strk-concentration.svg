xt x="420.0" y="412" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">under 1,000 followers</text><text x="780.0" y="347" font-size="54" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">3</text><text x="780.0" y="385" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">platforms carry it:</text><text x="780.0" y="412" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">66% X, 28% YouTube, 6% TikTok</text><rect x="60" y="441" width="1080" height="76" fill="#fbf7ef"/><rect x="60" y="441" width="5" height="76" fill="#a33228"/><text x="86" y="475" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">Spam ran 59.2% against the token's own 35.9% norm, a 1.65x lift.</text><text x="86" y="505" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">The one adverse signal, and 12.9 of the 25 points. Attention of this size attracts ticker spam.</text><line x1="60" y1="563" x2="1140" y2="563" stroke="#ded8cd" stroke-width="2"/><text x="60" y="611" font-size="46" fill="#236440" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">25 / 100</text><text x="290" y="599" font-size="26" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">organic</text><text x="290" y="629" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Under 30 on the published scale. Nothing here looks bought.</text><text x="1140" y="599" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">proofofcrowd.com</text><text x="1140" y="629" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">audited 2026-10-14</text></svg>