<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#ffffff"/><text x="60" y="58" font-size="36" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">33,623 holders. 1,187 of them hold $100 or more.</text><text x="60" y="92" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">$LAPTOP wallets by position size, rebuilt from all 1,964,431 transfers since deployment</text><text x="330" y="166" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">$10k or more</text><rect x="350" y="140" width="241" height="34" rx="4" fill="#8d8578"/><text x="604.9986613131161" y="167" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">49</text><text x="330" y="228" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">$1k - $10k</text><rect x="350" y="202" width="317" height="34" rx="4" fill="#8d8578"/><text x="680.9287281840958" y="229" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">167</text><text x="330" y="290" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">$100 - $1k</text><rect x="350" y="264" width="426" height="34" rx="4" fill="#1b3a6b"/><text x="789.936282756307" y="291" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">971</text><text x="330" y="352" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">$10 - $100</text><rect x="350" y="326" width="509" height="34" rx="4" fill="#8d8578"/><text x="873.0269148474888" y="353" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">3,715</text><text x="330" y="414" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">$1 - $10</text><rect x="350" y="388" width="543" height="34" rx="4" fill="#8d8578"/><text x="906.9405775230629" y="415" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">6,424</text><text x="330" y="476" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">under $1</text><rect x="350" y="450" width="620" height="34" rx="4" fill="#a33228"/><text x="984.0" y="477" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">22,297</text><rect x="60" y="526" width="1080" height="1.5" fill="#ded8cd"/><text x="60" y="572" font-size="24" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">Two thirds of the holder count holds less than one dollar.</text><text x="60" y="606" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Dust is normal for any ERC-20 and is not evidence of anything on its own. It does mean</text><text x="60" y="632" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">a headline holder number counts those addresses the same as the ones with money at stake.</text><text x="60" y="678" font-size="22" fill="#1b3a6b" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">Top ten addresses hold 91.7% of supply. 90.1 of those points sit in contracts,</text><text x="60" y="706" font-size="22" fill="#1b3a6b" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">multisigs and the burn address.</text><text x="60" y="734" font-size="17" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Proof of Crowd  ·  audited 2026-10-07  ·  Base</text><text x="1140" y="734" font-size="17" fill="#6e6a60" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">proofofcrowd.com</text></svg>