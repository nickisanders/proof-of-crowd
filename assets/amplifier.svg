<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#ffffff"/><text x="60" y="58" font-size="35" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">One signal, two different behaviours.</text><text x="60" y="92" font-size="20" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Posts from the 40 accounts appearing across the most of 130 audited tokens, by how many tokens each post names</text><text x="280" y="176" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">names 1 token</text><rect x="300" y="150" width="560" height="34" rx="4" fill="#8d8578"/><text x="874.0" y="177" font-size="22" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">46%</text><text x="280" y="238" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">names 2</text><rect x="300" y="212" width="47" height="34" rx="4" fill="#8d8578"/><text x="360.7495559502664" y="239" font-size="22" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">4%</text><text x="280" y="300" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">names 3 to 7</text><rect x="300" y="274" width="209" height="34" rx="4" fill="#8d8578"/><text x="522.8809946714032" y="301" font-size="22" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">17%</text><text x="280" y="362" font-size="21" fill="#15171c" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">names 8 or more</text><rect x="300" y="336" width="391" height="34" rx="4" fill="#1b3a6b"/><text x="704.9058614564831" y="363" font-size="22" fill="#15171c" font-weight="700" text-anchor="start" font-family="Menlo, ui-monospace, monospace">32%</text><rect x="60" y="414" width="1080" height="1.5" fill="#ded8cd"/><text x="60" y="458" font-size="24" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">A third of their posts name eight tokens or more.</text><rect x="60" y="510" width="520" height="150" rx="6" fill="#faf8f4"/><rect x="60" y="510" width="5" height="150" rx="2.5" fill="#8d8578"/><text x="86" y="550" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">The list poster</text><text x="86" y="586" font-size="22" fill="#8d8578" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">One post names 28 tickers.</text><text x="86" y="618" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">That single post places the account</text><text x="86" y="642" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">inside dozens of token conversations at once.</text><rect x="620" y="510" width="520" height="150" rx="6" fill="#faf8f4"/><rect x="620" y="510" width="5" height="150" rx="2.5" fill="#a33228"/><text x="646" y="550" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">The serial poster</text><text x="646" y="586" font-size="22" fill="#a33228" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">51 posts, one token each.</text><text x="646" y="618" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Almost no lists. Fifty-one separately written</text><text x="646" y="642" font-size="18" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">posts, each on the same template.</text><text x="60" y="706" font-size="23" fill="#15171c" font-weight="700" text-anchor="start" font-family="Charter, Georgia, serif">Both register as an account that also posts about other tokens.</text><text x="60" y="736" font-size="19" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Which is why the posts behind the number get read before anything is concluded.</text><text x="60" y="794" font-size="17" fill="#6e6a60" font-weight="400" text-anchor="start" font-family="Charter, Georgia, serif">Proof of Crowd  ·  130 audited tokens  ·  2026-10-13</text><text x="1140" y="794" font-size="17" fill="#6e6a60" font-weight="400" text-anchor="end" font-family="Charter, Georgia, serif">proofofcrowd.com</text></svg>